<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>D案 最小構成プロトタイプ Ver.4</title>
<style>
  body {
    background: #222;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    margin: 0;
  }
  #hud {
    margin-top: 10px;
  }
  #hud span {
    margin: 0 10px;
    font-size: 18px;
  }
  #gameArea {
    margin: 20px auto;
    background: #333;
    position: relative;
    width: 600px;
    height: 400px;
    border: 2px solid #555;
    overflow: hidden;
  }
  .player {
    width: 20px;
    height: 20px;
    background: #4af;
    position: absolute;
    border-radius: 4px;
  }
  .safe {
    width: 20px;
    height: 20px;
    background: #4f4;
    position: absolute;
    border-radius: 50%;
  }
  .danger {
    width: 20px;
    height: 20px;
    background: #f44;
    position: absolute;
    border-radius: 50%;
  }
  .enemy {
    width: 20px;
    height: 20px;
    background: #ff0;
    position: absolute;
    border-radius: 4px;
  }
  #endScreen {
    display: none;
    margin-top: 20px;
  }
  #restartBtn {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h2>D案 最小構成プロトタイプ Ver.4</h2>
<div id="hud">
  <span id="score">Score: 0</span>
  <span id="hp">HP: 3</span>
  <span id="timer">Time: 60</span>
</div>

<div id="gameArea">
  <div id="player" class="player"></div>
</div>

<div id="endScreen">
  <h2>ゲーム終了</h2>
  <div id="finalScore"></div>
  <div id="finalHP"></div>
  <button id="restartBtn">再プレイ</button>
</div>
<h2>調整パラメータ</h2>
<script>

  const CONFIG = {
    PLAYER_SPEED: 4,
    GAME_TIME: 60,
    SAFE_SCORE: 10,
    DANGER_SCORE: 30,
    RESOURCE_MIN_DIST_FROM_PLAYER: 60,
    RESOURCE_MIN_DIST_FROM_LAST: 40,
    ENEMY_RADIUS: 40,
    ENEMY_SPEED: 0.03,
    RESOURCE_MIN_DIST_BETWEEN_SAFE_AND_DANGER: 90
  };

  const gameArea = document.getElementById("gameArea");
  const player = document.getElementById("player");
  const scoreDisplay = document.getElementById("score");
  const hpDisplay = document.getElementById("hp");
  const timerDisplay = document.getElementById("timer");
  const endScreen = document.getElementById("endScreen");
  const finalScore = document.getElementById("finalScore");
  const finalHP = document.getElementById("finalHP");
  const restartBtn = document.getElementById("restartBtn");

  let score = 0;
  let hp = 3;
  let timeLeft = CONFIG.GAME_TIME;
  let keys = {};
  let safeResource = null;
  let dangerResource = null;
  let enemy = null;
  let enemyAngle = 0;
  let gameInterval = null;
  let timerInterval = null;

  let lastSafePos = { x: 150, y: 200 };
  let lastDangerPos = { x: 430, y: 200 };

  document.addEventListener("keydown", e => keys[e.key] = true);
  document.addEventListener("keyup", e => keys[e.key] = false);

  function startGame() {
    score = 0;
    hp = 3;
    timeLeft = CONFIG.GAME_TIME;
    scoreDisplay.textContent = "Score: " + score;
    hpDisplay.textContent = "HP: " + hp;
    timerDisplay.textContent = "Time: " + timeLeft;
    endScreen.style.display = "none";

    player.style.left = "290px";
    player.style.top = "190px";

    spawnResourcePair();

    gameInterval = setInterval(gameLoop, 16);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = "Time: " + timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    clearInterval(gameInterval);
    clearInterval(timerInterval);
    removeAllObjects();
    endScreen.style.display = "block";
    finalScore.textContent = "最終スコア: " + score;
    finalHP.textContent = "残りHP: " + hp;
  }

  restartBtn.onclick = startGame;

  function removeAllObjects() {
    if (safeResource) safeResource.remove();
    if (dangerResource) dangerResource.remove();
    if (enemy) enemy.remove();
    safeResource = null;
    dangerResource = null;
    enemy = null;
  }

  function gameLoop() {
    movePlayer();
    moveEnemy();
    checkSafeCollision();
    checkDangerCollision();
    checkEnemyCollision();
  }

  function movePlayer() {
    let x = parseInt(player.style.left);
    let y = parseInt(player.style.top);

    if (keys["ArrowUp"]) y -= CONFIG.PLAYER_SPEED;
    if (keys["ArrowDown"]) y += CONFIG.PLAYER_SPEED;
    if (keys["ArrowLeft"]) x -= CONFIG.PLAYER_SPEED;
    if (keys["ArrowRight"]) x += CONFIG.PLAYER_SPEED;

    x = Math.max(0, Math.min(580, x));
    y = Math.max(0, Math.min(380, y));

    player.style.left = x + "px";
    player.style.top = y + "px";
  }

  function randomPositionAvoiding(playerPos, lastPos, minDistFromPlayer, minDistFromLast) {
    let x, y;
    let attempts = 0;
    do {
      x = Math.random() * 560 + 20;
      y = Math.random() * 360 + 20;
      attempts++;
      const distPlayer = Math.hypot(x - playerPos.x, y - playerPos.y);
      const distLast = Math.hypot(x - lastPos.x, y - lastPos.y);
      if (distPlayer > minDistFromPlayer && distLast > minDistFromLast) break;
    } while (attempts < 50);
    return { x, y };
  }

  function spawnResourcePair() {
    removeAllObjects();

    const playerPos = {
      x: parseInt(player.style.left),
      y: parseInt(player.style.top)
    };

    let safePos, dangerPos;
    let attempts = 0;

    do {
      safePos = randomPositionAvoiding(
        playerPos,
        lastSafePos,
        CONFIG.RESOURCE_MIN_DIST_FROM_PLAYER,
        CONFIG.RESOURCE_MIN_DIST_FROM_LAST
      );

      dangerPos = randomPositionAvoiding(
        playerPos,
        lastDangerPos,
        CONFIG.RESOURCE_MIN_DIST_FROM_PLAYER,
        CONFIG.RESOURCE_MIN_DIST_FROM_LAST
      );

      attempts++;
      const safeToDanger = Math.hypot(safePos.x - dangerPos.x, safePos.y - dangerPos.y);
      if (safeToDanger >= CONFIG.RESOURCE_MIN_DIST_BETWEEN_SAFE_AND_DANGER) break;
    } while (attempts < 30);

    safeResource = document.createElement("div");
    safeResource.className = "safe";
    safeResource.style.left = safePos.x + "px";
    safeResource.style.top = safePos.y + "px";
    gameArea.appendChild(safeResource);

    dangerResource = document.createElement("div");
    dangerResource.className = "danger";
    dangerResource.style.left = dangerPos.x + "px";
    dangerResource.style.top = dangerPos.y + "px";
    gameArea.appendChild(dangerResource);

    lastSafePos = safePos;
    lastDangerPos = dangerPos;

    spawnEnemyAroundDanger();
  }

  function spawnEnemyAroundDanger() {
    enemy = document.createElement("div");
    enemy.className = "enemy";
    enemyAngle = Math.random() * Math.PI * 2;

    const rx = parseInt(dangerResource.style.left);
    const ry = parseInt(dangerResource.style.top);

    const ex = rx + Math.cos(enemyAngle) * CONFIG.ENEMY_RADIUS;
    const ey = ry + Math.sin(enemyAngle) * CONFIG.ENEMY_RADIUS;

    enemy.style.left = ex + "px";
    enemy.style.top = ey + "px";

    gameArea.appendChild(enemy);
  }

  function moveEnemy() {
    if (!enemy || !dangerResource) return;

    const rx = parseInt(dangerResource.style.left);
    const ry = parseInt(dangerResource.style.top);

    enemyAngle += CONFIG.ENEMY_SPEED;

    const ex = rx + Math.cos(enemyAngle) * CONFIG.ENEMY_RADIUS;
    const ey = ry + Math.sin(enemyAngle) * CONFIG.ENEMY_RADIUS;

    enemy.style.left = Math.max(0, Math.min(580, ex)) + "px";
    enemy.style.top = Math.max(0, Math.min(380, ey)) + "px";
  }

  function checkSafeCollision() {
    if (!safeResource) return;

    const px = parseInt(player.style.left);
    const py = parseInt(player.style.top);
    const sx = parseInt(safeResource.style.left);
    const sy = parseInt(safeResource.style.top);

    const dist = Math.hypot(px - sx, py - sy);

    if (dist < 20) {
      score += CONFIG.SAFE_SCORE;
      scoreDisplay.textContent = "Score: " + score;
      spawnResourcePair();
    }
  }

  function checkDangerCollision() {
    if (!dangerResource) return;

    const px = parseInt(player.style.left);
    const py = parseInt(player.style.top);
    const dx = parseInt(dangerResource.style.left);
    const dy = parseInt(dangerResource.style.top);

    const dist = Math.hypot(px - dx, py - dy);

    if (dist < 20) {
      score += CONFIG.DANGER_SCORE;
      scoreDisplay.textContent = "Score: " + score;
      spawnResourcePair();
    }
  }

  function checkEnemyCollision() {
    if (!enemy) return;

    const px = parseInt(player.style.left);
    const py = parseInt(player.style.top);
    const ex = parseInt(enemy.style.left);
    const ey = parseInt(enemy.style.top);

    const dist = Math.hypot(px - ex, py - ey);

    if (dist < 20) {
      hp -= 1;
      hpDisplay.textContent = "HP: " + hp;
      if (hp <= 0) {
        endGame();
      } else {
        player.style.left = (px + (px - ex)) + "px";
        player.style.top = (py + (py - ey)) + "px";
      }
    }
  }

  startGame();
</script>

</body>
</html>
